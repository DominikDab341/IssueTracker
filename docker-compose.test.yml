services:
  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: issuetracker_test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: issuetracker_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuetracker_test -d issuetracker_test"]
      interval: 2s
      timeout: 5s
      retries: 30
